<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canada Deco — Catalogue 2026</title>
<style>
  :root{
    --ink:#120F0D;
    --ink-2:#1d1915;
    --gold:#C9973F;
    --gold-soft:#E6C27A;
    --cream:#EDE4D8;
    --muted:#8c8277;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);color:var(--cream);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
  header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:5;background:linear-gradient(var(--ink),rgba(18,15,13,0));}
  header .brand{font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold-soft)}
  header .count{font-size:12px;letter-spacing:.2em;color:var(--muted)}
  .stage{position:absolute;top:56px;bottom:96px;left:0;right:0;display:flex;align-items:center;justify-content:center;perspective:2400px}
  .book{position:relative;height:100%;max-height:calc(100vh - 152px);aspect-ratio:2/1.42;max-width:94vw;display:flex;box-shadow:0 30px 80px rgba(0,0,0,.7)}
  .leaf{flex:1;position:relative;background:var(--ink-2);overflow:hidden}
  .leaf img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s ease}
  .leaf img.loaded{opacity:1}
  .leaf.left{border-radius:4px 0 0 4px;box-shadow:inset -40px 0 60px -40px rgba(0,0,0,.6)}
  .leaf.right{border-radius:0 4px 4px 0;box-shadow:inset 40px 0 60px -40px rgba(0,0,0,.6)}
  .leaf.single{flex:0 0 auto;aspect-ratio:1.4/1;height:100%}
  .spine{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:linear-gradient(to right,rgba(0,0,0,.55),rgba(255,255,255,.06),rgba(0,0,0,.55));z-index:2;pointer-events:none}
  .folio{position:absolute;bottom:12px;font-size:11px;letter-spacing:.3em;color:rgba(237,228,216,.55);z-index:3}
  .leaf.left .folio{left:22px}
  .leaf.right .folio{right:22px}
  .turning{animation:turn .55s ease}
  @keyframes turn{0%{transform:rotateY(0)}50%{transform:rotateY(-8deg) scale(.985)}100%{transform:rotateY(0)}}
  button.nav{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;border:1px solid rgba(201,151,63,.5);background:rgba(18,15,13,.7);color:var(--gold-soft);font-size:22px;cursor:pointer;z-index:6;transition:background .2s,color .2s}
  button.nav:hover{background:var(--gold);color:var(--ink)}
  button.nav:disabled{opacity:.25;cursor:default;background:transparent}
  #prev{left:18px}
  #next{right:18px}
  footer{position:fixed;bottom:0;left:0;right:0;height:96px;background:var(--ink);border-top:1px solid rgba(201,151,63,.25);display:flex;align-items:center;gap:18px;padding:0 24px;overflow-x:auto;z-index:5}
  footer .thumb{flex:0 0 auto;width:62px;height:44px;object-fit:cover;opacity:.45;cursor:pointer;border:1px solid transparent;transition:opacity .2s,border-color .2s}
  footer .thumb:hover{opacity:.85}
  footer .thumb.active{opacity:1;border-color:var(--gold)}
  .progress{position:fixed;left:0;bottom:96px;height:2px;background:var(--gold);z-index:6;transition:width .4s ease}
  .hint{position:fixed;bottom:106px;right:24px;font-size:11px;letter-spacing:.2em;color:var(--muted);z-index:4}
  @media (max-width:760px){
    .book{flex-direction:column;aspect-ratio:auto;max-height:none;width:92vw;height:auto}
    .leaf.left,.leaf.right{border-radius:4px}
    .spine{display:none}
    .leaf{aspect-ratio:1.4/1;flex:none}
    .stage{overflow:auto}
    button.nav{top:auto;bottom:112px;transform:none}
    .hint{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">Canada Deco &middot; Catalogue 2026</div>
  <div class="count" id="count"></div>
</header>

<div class="stage">
  <div class="book" id="book"></div>
</div>

<button class="nav" id="prev" aria-label="Page précédente">&#8592;</button>
<button class="nav" id="next" aria-label="Page suivante">&#8594;</button>
<div class="progress" id="progress"></div>
<div class="hint">&larr; &rarr; pour tourner les pages</div>

<footer id="thumbs"></footer>

<script>
  const TOTAL = 17;
  // Spreads: cover alone, then pairs, back cover paired with last inside page
  const spreads = [[1]];
  for (let p = 2; p < TOTAL; p += 2) spreads.push([p, p + 1 <= TOTAL ? p + 1 : null].filter(Boolean));
  if (TOTAL % 2 === 1 && spreads[spreads.length-1].length === 2 && spreads[spreads.length-1][1] === TOTAL) {}
  const pad = n => String(n).padStart(2, '0');
  const src = n => `p-${pad(n)}.jpg`;

  let idx = 0;
  const book = document.getElementById('book');
  const thumbs = document.getElementById('thumbs');
  const countEl = document.getElementById('count');
  const progress = document.getElementById('progress');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  function leafHTML(n, side) {
    if (!n) return `<div class="leaf ${side}"></div>`;
    return `<div class="leaf ${side}"><img src="${src(n)}" alt="Page ${n}"><div class="folio">${pad(n)}</div></div>`;
  }

  function render(animate) {
    const s = spreads[idx];
    let html;
    if (s.length === 1) {
      html = `<div class="leaf single"><img src="${src(s[0])}" alt="Page ${s[0]}"><div class="folio">${pad(s[0])}</div></div>`;
    } else {
      html = leafHTML(s[0], 'left') + `<div class="spine"></div>` + leafHTML(s[1], 'right');
    }
    book.innerHTML = html;
    book.querySelectorAll('img').forEach(im => {
      im.onload = () => im.classList.add('loaded');
      if (im.complete) im.classList.add('loaded');
    });
    if (animate) { book.classList.remove('turning'); void book.offsetWidth; book.classList.add('turning'); }

    countEl.textContent = `${s.map(pad).join(' — ')} / ${pad(TOTAL)}`;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === spreads.length - 1;
    progress.style.width = ((idx + 1) / spreads.length * 100) + '%';
    document.querySelectorAll('footer .thumb').forEach((t, i) => t.classList.toggle('active', spreads[i].includes(s[0]) || i === idx));
    const active = thumbs.querySelector('.active');
    if (active) active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  function go(i) {
    if (i < 0 || i >= spreads.length) return;
    idx = i;
    render(true);
  }

  // Build thumbnails, one per spread
  spreads.forEach((s, i) => {
    const im = document.createElement('img');
    im.className = 'thumb';
    im.src = src(s[0]);
    im.alt = 'Pages ' + s.join('-');
    im.onclick = () => go(i);
    thumbs.appendChild(im);
  });

  prevBtn.onclick = () => go(idx - 1);
  nextBtn.onclick = () => go(idx + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(idx + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(idx - 1);
  });

  // Swipe
  let x0 = null;
  book.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
  book.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) dx < 0 ? go(idx + 1) : go(idx - 1);
    x0 = null;
  });

  render(false);
</script>
<style>
  .switch-btn{position:fixed;right:18px;bottom:18px;z-index:9;padding:10px 16px;border:1px solid #C9973F;background:rgba(18,15,13,.85);color:#E6C27A;font:12px Georgia,serif;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer}
  .switch-btn:hover{background:#C9973F;color:#120F0D}
</style>
<a class="switch-btn" href="../catalogue-zap/">Version zap &rarr;</a>
</body>
</html>
