<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canada Deco — Catalogue 2026</title>
<style>
  :root{--ink:#120F0D;--gold:#C9973F;--gold-soft:#E6C27A;--cream:#EDE4D8;--muted:#8c8277}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--ink);color:var(--cream);font-family:Georgia,"Times New Roman",serif}
  body{display:flex;align-items:center;justify-content:center;padding:24px}
  main{width:100%;max-width:560px;text-align:center}
  .brand{font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:14px}
  h1{font-weight:normal;font-size:28px;letter-spacing:.08em;margin-bottom:8px}
  .sub{font-size:13px;color:var(--muted);letter-spacing:.12em;margin-bottom:36px}
  .choices{display:flex;flex-direction:column;gap:14px}
  a.choice{display:block;padding:20px 22px;border:1px solid var(--gold);color:var(--cream);text-decoration:none;transition:background .2s,color .2s}
  a.choice:hover,a.choice:focus{background:var(--gold);color:var(--ink)}
  a.choice .t{display:block;font-size:17px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
  a.choice .d{display:block;font-size:13px;color:var(--muted)}
  a.choice:hover .d,a.choice:focus .d{color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="brand">Canada Deco &middot; Catalogue 2026</div>
  <h1>Choisissez votre lecture</h1>
  <p class="sub">17 pages</p>
  <div class="choices">
    <a class="choice" href="catalogue/">
      <span class="t">Version magazine</span>
      <span class="d">Doubles pages, à feuilleter comme un magazine</span>
    </a>
    <a class="choice" href="catalogue-feuilleton/">
      <span class="t">Version feuilleton</span>
      <span class="d">Pages qui se tournent comme un vrai catalogue</span>
    </a>
    <a class="choice" href="catalogue-zap/">
      <span class="t">Version zap</span>
      <span class="d">Une page plein écran, on passe d'une page à l'autre</span>
    </a>
  </div>
</main>
</body>
</html>
