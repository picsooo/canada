<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canada Deco — Catalogue 2026</title>
<style>
  :root{
    --ink:#120F0D;
    --ink-2:#1d1915;
    --gold:#C9973F;
    --gold-soft:#E6C27A;
    --cream:#EDE4D8;
    --muted:#8c8277;
    --ratio:1.3974; /* 617.957 / 442.207 : format paysage des pages */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:radial-gradient(ellipse at center,#221d18 0%,var(--ink) 70%);color:var(--cream);font-family:Georgia,"Times New Roman",serif;overflow:hidden;user-select:none;-webkit-user-select:none}

  header{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:20}
  header a{font-size:12px;letter-spacing:.2em;color:var(--muted);text-decoration:none;text-transform:uppercase}
  header a:hover{color:var(--gold-soft)}
  header .brand{font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold-soft)}

  .stage{position:absolute;top:52px;bottom:84px;left:0;right:0;display:flex;align-items:center;justify-content:center}

  /* Le livre : la perspective s'applique à ses enfants (les feuillets) */
  .book{
    --pw:min(44vw, calc((100vh - 170px) * 1.3974));
    position:relative;
    width:calc(var(--pw) * 2);
    height:calc(var(--pw) / 1.3974);
    perspective:2400px;
    transition:transform .9s cubic-bezier(.65,0,.35,1);
    box-shadow:0 36px 60px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(201,151,63,.18);
  }

  /* Un feuillet : recto (front) et verso (back), pivote autour de la reliure */
  .leaf{
    position:absolute;
    top:0;
    left:var(--pw);
    width:var(--pw);
    height:100%;
    transform-origin:left center;
    transform-style:preserve-3d;
    transition:transform .9s cubic-bezier(.65,0,.35,1);
  }
  .leaf.flipped{transform:rotateY(-180deg)}

  .face{
    position:absolute;
    inset:0;
    overflow:hidden;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    background:var(--ink-2);
  }
  .face.back{transform:rotateY(180deg)}
  .face img{width:100%;height:100%;display:block;object-fit:cover}
  .face.blank{background:#1a1613}

  /* Ombre de la reliure et léger dégradé de papier */
  .face::after{content:"";position:absolute;top:0;bottom:0;width:38%;pointer-events:none}
  .face.front::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.42),rgba(0,0,0,0))}
  .face.back::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.42),rgba(0,0,0,0))}
  .face::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.04),rgba(255,255,255,0) 45%,rgba(0,0,0,.06));z-index:2}

  .spine{
    position:absolute;
    top:0;bottom:0;
    left:var(--pw);
    width:24px;
    transform:translateX(-50%);
    background:linear-gradient(to right,rgba(0,0,0,0),rgba(0,0,0,.35) 45%,rgba(255,255,255,.05) 50%,rgba(0,0,0,.35) 55%,rgba(0,0,0,0));
    pointer-events:none;
    z-index:999;
  }

  /* Zones cliquables gauche / droite */
  .zone{position:absolute;top:0;bottom:0;width:30%;z-index:50;cursor:pointer}
  .zone.prev{left:0}
  .zone.next{right:0}

  .rotate-hint{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:14px;letter-spacing:.12em;color:var(--gold-soft);background:rgba(18,15,13,.92);z-index:80}

  footer{
    position:fixed;bottom:0;left:0;right:0;height:84px;
    display:flex;align-items:center;justify-content:center;gap:22px;
    border-top:1px solid rgba(201,151,63,.2);
    background:var(--ink);
    z-index:20;
  }
  footer button{
    width:48px;height:48px;border:1px solid rgba(201,151,63,.55);background:transparent;color:var(--gold-soft);
    font-size:20px;cursor:pointer;transition:background .2s,color .2s;font-family:inherit
  }
  footer button:hover:not(:disabled){background:var(--gold);color:var(--ink)}
  footer button:disabled{opacity:.25;cursor:default}
  .counter{font-size:12px;letter-spacing:.3em;color:var(--cream);min-width:150px;text-align:center}
  .progress{position:absolute;top:0;left:0;height:2px;background:var(--gold);transition:width .6s ease}

  @media (max-width:760px) and (orientation:portrait){
    .rotate-hint{display:flex}
  }
  @media (max-width:760px){
    .counter{min-width:120px;font-size:11px}
  }
</style>
</head>
<body>

<header>
  <a href="../">&larr; Accueil</a>
  <div class="brand">Canada Deco &middot; 2026</div>
</header>

<div class="stage" id="stage">
  <div class="book" id="book"><div class="spine" id="spine"></div></div>
  <div class="zone prev" id="zprev"></div>
  <div class="zone next" id="znext"></div>
  <div class="rotate-hint">Tourne ton téléphone en paysage pour lire le catalogue en double page</div>
</div>

<footer>
  <button id="prev" aria-label="Page précédente">&#8592;</button>
  <div class="counter" id="counter"></div>
  <button id="next" aria-label="Page suivante">&#8594;</button>
  <div class="progress" id="progress"></div>
</footer>

<script>
  const TOTAL = 17;               // pages du PDF
  const LEAVES = 9;               // feuillets : (1|2), (3|4) ... (17|vide)
  const MAX_S = LEAVES - 1;       // nombre max de feuillets tournés (8)
  const pad = n => String(n).padStart(2, '0');

  const book = document.getElementById('book');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  // Construction des feuillets : recto = 2k+1, verso = 2k+2
  const leaves = [];
  for (let k = 0; k < LEAVES; k++) {
    const front = 2 * k + 1;
    const back = 2 * k + 2;
    const el = document.createElement('div');
    el.className = 'leaf';
    el.innerHTML =
      `<div class="face front"><img src="f-${pad(front)}.jpg" alt="Page ${front}"></div>` +
      (back <= TOTAL
        ? `<div class="face back"><img src="f-${pad(back)}.jpg" alt="Page ${back}"></div>`
        : `<div class="face back blank"></div>`);
    book.insertBefore(el, document.getElementById('spine'));
    leaves.push(el);
  }

  let s = 0; // nombre de feuillets tournés

  function render() {
    leaves.forEach((el, k) => {
      const flipped = k < s;
      el.classList.toggle('flipped', flipped);
      // Feuillets tournés : le plus récent est au-dessus à gauche ; non tournés : le premier est au-dessus à droite
      el.style.zIndex = flipped ? (k + 1) : (LEAVES - k);
    });

    // Couverture seule : on recentre le livre fermé
    book.style.transform = s === 0 ? 'translateX(-25%)' : 'translateX(0)';

    const label = s === 0
      ? `01 / ${pad(TOTAL)}`
      : `${pad(2 * s)} — ${pad(2 * s + 1)} / ${pad(TOTAL)}`;
    counter.textContent = label;

    prevBtn.disabled = s === 0;
    nextBtn.disabled = s === MAX_S;
    progress.style.width = ((s + 1) / (MAX_S + 1) * 100) + '%';
  }

  function go(n) {
    const next = Math.max(0, Math.min(MAX_S, n));
    if (next === s) return;
    s = next;
    render();
  }

  prevBtn.onclick = () => go(s - 1);
  nextBtn.onclick = () => go(s + 1);
  document.getElementById('zprev').onclick = () => go(s - 1);
  document.getElementById('znext').onclick = () => go(s + 1);

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(s + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(s - 1);
  });

  // Glissement tactile
  let x0 = null;
  const stage = document.getElementById('stage');
  stage.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  stage.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) dx < 0 ? go(s + 1) : go(s - 1);
    x0 = null;
  });

  render();
</script>
</body>
</html>
